<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SMS Resistências · Central do Cliente · Molla</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1A212B">
<meta name="apple-mobile-web-app-title" content="Central SMS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400..900;125,700..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E242C; --navy:#222A35; --navy-deep:#1A212B; --paper:#FFFFFF; --bg:#F5F5F2;
    --soft:#69717C; --soft-light:#9AA1AB; --line:#E5E3DC;
    --orange:#FF7A33; --orange-deep:#E05E14; --orange-chip:#FFF1E8; --red:#C8402E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:"Inter",Arial,sans-serif;color:var(--ink);background:var(--navy-deep);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;position:relative;overflow:hidden;
  }
  body::before{content:"";position:fixed;left:-220px;top:-220px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle, rgba(255,122,51,.22) 0%, rgba(255,122,51,0) 62%);pointer-events:none;}
  body::after{content:"";position:fixed;right:-260px;bottom:-300px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle, rgba(224,94,20,.16) 0%, rgba(224,94,20,0) 62%);pointer-events:none;}

  .card{
    position:relative;z-index:1;width:100%;max-width:430px;background:var(--paper);border-radius:22px;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);
  }
  .card::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--orange),var(--orange-deep));}
  .brand{padding:34px 36px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;border-bottom:1px solid var(--line);}
  .brand .logo{height:86px;width:auto;display:block;}
  .body{padding:30px 34px 32px;}
  .chip{display:inline-block;margin:0 auto 16px;background:var(--orange-chip);color:var(--orange-deep);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;padding:7px 16px;border-radius:999px;}
  .center{text-align:center;}
  h1{font-family:"Archivo",sans-serif;font-weight:850;font-size:30px;line-height:1.1;letter-spacing:-.01em;}
  h1 em{font-style:normal;color:var(--orange);}
  .sub{margin-top:10px;font-size:14.5px;color:var(--soft);}
  form{margin-top:26px;display:flex;flex-direction:column;gap:16px;}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;}
  .field{position:relative;}
  input{
    width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;background:#FAFAF8;
    padding:0 64px 0 16px;font:inherit;font-size:15px;color:var(--ink);outline:none;transition:border-color .2s, box-shadow .2s;
  }
  input::placeholder{color:var(--soft-light);}
  input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,122,51,.15);background:#fff;}
  .field.name input{padding-right:16px;}
  .toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;font:inherit;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;padding:6px;}
  .btn{
    margin-top:6px;height:50px;border:none;border-radius:12px;cursor:pointer;color:#fff;font:inherit;font-weight:800;font-size:15px;
    background:linear-gradient(90deg,var(--orange),var(--orange-deep));box-shadow:0 10px 24px rgba(224,94,20,.28);transition:transform .15s, box-shadow .2s, filter .2s;
  }
  .btn:hover{filter:brightness(1.05);box-shadow:0 14px 30px rgba(224,94,20,.34);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible,input:focus-visible,.toggle:focus-visible{outline:3px solid rgba(255,122,51,.5);outline-offset:2px;}
  .err{display:none;margin-top:-4px;font-size:13px;color:var(--red);font-weight:600;}
  .err.on{display:block;}
  .card.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .foot{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;}
  .foot img{height:20px;width:auto;}
  .foot span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--soft-light);}
  @media (prefers-reduced-motion:reduce){.card.shake{animation:none;}}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="brand">
      <img class="logo" src="assets/sms-logo.svg" alt="SMS Resistências Elétricas">
    </div>
    <div class="body center">
      <span class="chip">SMS Resistências · 2026</span>
      <h1>Acesso <em>restrito</em></h1>
      <p class="sub">Identifique-se para acessar a Central do Cliente.</p>
      <form id="f" novalidate style="text-align:left">
        <div>
          <label for="nome">Seu nome</label>
          <div class="field name"><input id="nome" name="nome" type="text" placeholder="Como você quer ser identificado" autocomplete="name" required></div>
        </div>
        <div>
          <label for="senha">Senha</label>
          <div class="field">
            <input id="senha" name="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle" id="tg" aria-label="Mostrar senha">Ver</button>
          </div>
        </div>
        <p class="err" id="err" role="alert">Senha incorreta. Confira o guia de acesso ou fale com a Molla.</p>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <div class="foot">
        <img src="assets/molla-laranja.png" alt="Molla">
        <span>Central do Cliente · Agência Molla</span>
      </div>
    </div>
  </main>

<script>
(function(){
  // Chave de acesso: hash SHA-256 da senha em minúsculas (a senha não diferencia maiúsculas). Veja o README para trocar.
  const HASH='748ede448a718f958a5d1f745f5c01b4eb0fb709c0ab84c2f940cbf8adf911af';
  const f=document.getElementById('f'), nome=document.getElementById('nome'), senha=document.getElementById('senha');
  const err=document.getElementById('err'), card=document.getElementById('card'), tg=document.getElementById('tg');
  function get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
  if(get('sms_auth')==='ok'){location.replace('central.html');}
  tg.addEventListener('click',()=>{const t=senha.type==='password';senha.type=t?'text':'password';tg.textContent=t?'Ocultar':'Ver';});
  async function sha(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  f.addEventListener('submit',async e=>{
    e.preventDefault(); err.classList.remove('on');
    const n=nome.value.trim();
    if(!n){nome.focus();return;}
    const ok=(await sha(senha.value.trim().toLowerCase()))===HASH;
    if(!ok){err.classList.add('on');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');senha.select();return;}
    set('sms_auth','ok'); set('sms_nome',n);
    location.href='central.html';
  });
})();
</script>
</body>
</html>
